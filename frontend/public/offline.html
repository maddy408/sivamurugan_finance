<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Siva Murugan Chit Fund</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:linear-gradient(160deg,#0f172a,#1e1b4b);
      color:#fff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
    .box{max-width:340px}
    .pill{width:64px;height:64px;border-radius:18px;background:#2563eb;display:grid;place-items:center;
      margin:0 auto 16px;font-weight:800;font-size:22px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#cbd5e1;font-size:14px;line-height:1.5;margin:0 0 20px}
    button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <div class="pill">SM</div>
    <h1>You're offline</h1>
    <p>Siva Murugan Chit Fund needs a connection to load live data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
